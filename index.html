<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages は応答ヘッダーを設定できないので、読み込んでよい先をここで決める(docs/redblue-report.md の RT-002) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ITAcrony</title>
  <meta name="description" content="情報処理技術者試験のシラバスに出てくる IT の略語を、一次情報の引用付きで覚えるクイズ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='3' fill='%23c4470f'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='7' y='10' width='5' height='7' rx='1'/%3E%3Crect x='13.5' y='10' width='5' height='7' rx='1'/%3E%3Crect x='20' y='10' width='5' height='7' rx='1'/%3E%3Crect x='7' y='20' width='18' height='1.8' rx='.9'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" href="./" aria-label="ITAcrony 最初の画面へ">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand__card" x="3" y="6" width="26" height="20" rx="3"/><rect class="brand__glyph" x="7" y="10" width="5" height="7" rx="1"/><rect class="brand__glyph" x="13.5" y="10" width="5" height="7" rx="1"/><rect class="brand__glyph" x="20" y="10" width="5" height="7" rx="1"/><rect class="brand__glyph" x="7" y="20" width="18" height="1.8" rx=".9"/></svg>
        <span class="brand__name">ITAcrony</span>
      </a>
      <p class="masthead__note">情報処理技術者試験のシラバスの略語を、一次情報の引用付きで覚える</p>
    </div>
  </header>

  <main id="main" class="page">
    <!-- 最初の画面 -->
    <section id="setup" class="screen" hidden aria-labelledby="setup-title">
      <h1 id="setup-title" class="screen__title" tabindex="-1">出題の条件</h1>

      <div class="field">
        <p class="field__label" id="lbl-level">レベル<span class="field__hint">選んだレベル以下の語がすべて出る</span></p>
        <div class="seg seg--levels" role="radiogroup" aria-labelledby="lbl-level" data-name="level"></div>
      </div>

      <div class="field">
        <p class="field__label" id="lbl-direction">出題の向き</p>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-direction" data-name="direction"></div>
      </div>

      <div class="field">
        <p class="field__label" id="lbl-mode">出し方</p>
        <div class="seg" role="radiogroup" aria-labelledby="lbl-mode" data-name="mode"></div>
      </div>

      <div class="field">
        <p class="field__label" id="lbl-count">問題の数</p>
        <div class="seg seg--compact" role="radiogroup" aria-labelledby="lbl-count" data-name="count"></div>
      </div>

      <div class="setup__foot">
        <p class="setup__pool" id="pool-size" aria-live="polite"></p>
        <p class="setup__hint">問題では、1〜4 のキーでも選べます。</p>
        <button class="btn btn--primary" id="start" type="button">始める</button>
      </div>
    </section>

    <!-- 問題の画面 -->
    <section id="quiz" class="screen" hidden aria-labelledby="quiz-title">
      <h1 id="quiz-title" class="sr-only" tabindex="-1">問題</h1>
      <div class="progress" aria-hidden="true"><div class="progress__bar" id="progress-bar"></div></div>
      <div class="quiz__meta">
        <span id="q-count"></span>
        <span id="q-kind" class="tag"></span>
      </div>
      <div class="card card--question">
        <p class="card__ask" id="q-ask"></p>
        <p class="card__prompt" id="q-prompt"></p>
        <p class="card__context" id="q-context" hidden></p>
      </div>
      <ol class="choices" id="choices"></ol>
      <p id="verdict-live" class="sr-only" role="status"></p>
      <div id="answer" class="answer" hidden></div>
      <div class="confirm" id="quit-confirm" role="group" aria-labelledby="quit-confirm-text" hidden>
        <p class="confirm__text" id="quit-confirm-text"></p>
        <div class="confirm__actions">
          <button class="btn btn--ghost" id="quit-yes" type="button">やめる</button>
          <button class="btn btn--primary" id="quit-no" type="button">続ける</button>
        </div>
      </div>
      <div class="quiz__foot">
        <button class="btn btn--ghost" id="quit" type="button">やめる</button>
        <button class="btn btn--primary" id="next" type="button" hidden>次へ</button>
      </div>
    </section>

    <!-- 結果の画面 -->
    <section id="result" class="screen" hidden aria-labelledby="result-title">
      <h1 id="result-title" class="screen__title" tabindex="-1">結果</h1>
      <p class="score" id="score"></p>
      <div id="missed"></div>
      <div class="result__actions">
        <button class="btn btn--primary" id="again" type="button">同じ条件でもう一度</button>
        <button class="btn" id="retry-missed" type="button">間違えた語だけもう一度</button>
        <button class="btn btn--ghost" id="change" type="button">条件を変える</button>
      </div>
    </section>

    <p class="loading" id="loading">読み込み中</p>
  </main>

  <footer class="colophon">
    <p>個人が作った学習用のクイズで、IPA(情報処理推進機構)とは関係ありません。フルスペルは規格・公的機関などの一次情報で確かめ、答えに引用と出典を付けています。説明文は独自に書いたものです。</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
